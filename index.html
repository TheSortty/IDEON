  <!-- Web3Forms recibe el formulario de contacto, pero recien cuando alguien lo
       envia. Un preconnect abria una conexion en la carga inicial que la
       mayoria de las visitas nunca usa (PageSpeed lo marcaba como conexion
       desperdiciada); dns-prefetch adelanta solo el DNS, que sale casi gratis. -->
  <link rel="dns-prefetch" href="https://api.web3forms.com" />

  <!-- Inter, self-hosted: el @font-face vive en src/index.css -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- JSON-LD Structured Data -->
  <!--

    dominio, no a una página en particular: vale igual en la home que en los
    legales. El marcado que sí depende de la ruta (FAQPage, WebPage de cada
    legal) se inyecta desde React con el hook useJsonLd.

    `sameAs` es lo que ata este dominio a las redes oficiales: si se agrega o
    se cambia una red, actualizar TAMBIEN src/constants/seo.ts, que es de
    donde el footer saca los links.
  -->
